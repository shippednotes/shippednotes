<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{% block title %}{{ config.title }}{% endblock title %}</title>
  <meta name="description" content="{% block description %}{{ config.description }}{% endblock description %}">
  <link rel="stylesheet" href="{{ get_url(path='style.css', cachebust=true) }}">
  <link rel="alternate" type="application/atom+xml" title="{{ config.title }}" href="{{ get_url(path='atom.xml', trailing_slash=false) }}">
</head>
<body>
  <header>
    <nav>
      <a class="brand" href="{{ get_url(path='') }}">~/shipped-notes</a>
      <span class="links">
        <a href="{{ get_url(path='@/blog/_index.md') }}">/blog</a>
        <a href="{{ get_url(path='tags') }}">/tags</a>
        <a href="{{ get_url(path='@/about.md') }}">/about</a>
        <a href="{{ get_url(path='atom.xml', trailing_slash=false) }}">feed</a>
      </span>
    </nav>
  </header>

  <main>
    {% block content %}{% endblock content %}
  </main>

  <footer>
    <p><span class="prompt">$</span> whoami</p>
    <p>
      {% for a in config.extra.authors %}<a href="{{ a.url }}">{{ a.name }}</a>{% if not loop.last %} &amp; {% endif %}{% endfor %}
      · {{ now() | date(format="%Y") }}
      {% if config.extra.repo %}· <a href="{{ config.extra.repo }}">source</a>{% endif %}
    </p>
  </footer>
</body>
</html>
