{% macro post_list(pages) %}
<ul class="posts">
  {% for page in pages %}
  <li>
    <span class="arrow">&gt;</span>
    <a href="{{ page.permalink | safe }}">{{ page.title }}</a>
    {% if page.date %}<time datetime="{{ page.date }}">{{ page.date | date(format="%b %d, %Y") }}</time>{% endif %}
  </li>
  {% endfor %}
</ul>
{% endmacro post_list %}
